name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightwave-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp-idf-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [reference, bench]
    steps:
      - uses: actions/checkout@v7
      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
          command: idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.${{ matrix.board }}" build size size-components
