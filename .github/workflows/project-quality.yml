name: Project quality

on:
  push:
    paths:
      - "docs/**"
      - "hardware/*.csv"
      - "hardware/*.json"
      - "hardware/kicad/nightwave-reference/**"
      - "measurements/trial-evidence.json"
      - "tools/**"
      - "tests/**"
      - "firmware/**"
      - ".github/workflows/project-quality.yml"
  pull_request:
    paths:
      - "docs/**"
      - "hardware/*.csv"
      - "hardware/*.json"
      - "hardware/kicad/nightwave-reference/**"
      - "measurements/trial-evidence.json"
      - "tools/**"
      - "tests/**"
      - "firmware/**"
      - ".github/workflows/project-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightwave-project-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate BOMs and wiring consistency
        run: python3 tools/validate_project.py
      - name: Check reference-design pin and footprint regressions (not electrical sign-off)
        run: |
          python3 tools/validate_reference_design.py
          python3 -m unittest discover -s tests -p 'test_reference_design.py'
          python3 tools/validate_reference_package.py
      - name: Test shipping artifact inventory and incomplete-cost handling
        run: python3 -m unittest discover -s tests -p 'test_shipping_readiness.py'
      - name: Test finished-device evidence inventory without certifying physical results
        run: python3 -m unittest discover -s tests -p 'test_trial_readiness.py'
      - name: Test selected-product power arithmetic and unknown measurement status
        run: python3 -m unittest discover -s tests -p 'test_product_power_budget.py'
      - name: Calculate selected-product screening model
        run: python3 tools/product_power_budget.py
      - name: Generate deterministic audio fixtures
        run: python3 tools/generate_test_media.py --output .generated/test-media
      - name: Encode original MP3 fixtures
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -nostdin -y -i .generated/test-media/02_left_right_stereo_44100.wav -codec:a libmp3lame -b:a 128k -metadata title=Nightwave-test .generated/test-media/test-cbr.mp3
          ffmpeg -nostdin -y -i .generated/test-media/02_left_right_stereo_44100.wav -ar 48000 -ac 1 -codec:a libmp3lame -q:a 4 .generated/test-media/test-vbr.mp3
          ffmpeg -nostdin -y -i .generated/test-media/02_left_right_stereo_44100.wav -ar 22050 -ac 1 -codec:a libmp3lame -b:a 64k .generated/test-media/test-mpeg2.mp3
          ffmpeg -nostdin -y -stream_loop -1 -i .generated/test-media/02_left_right_stereo_44100.wav -t 30 -codec:a libmp3lame -b:a 128k .generated/test-media/test-seek.mp3
      - name: Check conservative power arithmetic
        run: python3 tools/power_budget.py
      - name: Check mentor engineering calculations
        run: python3 tools/engineering_calculations.py
      - name: Configure portable firmware tests
        run: cmake -S tests -B build/host-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build portable firmware tests
        run: cmake --build build/host-tests --config Release --parallel
      - name: Run portable firmware tests
        run: ctest --test-dir build/host-tests --build-config Release --output-on-failure
      - name: Check host memory safety with AddressSanitizer
        run: |
          cmake -S tests -B build/asan-tests -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build/asan-tests --parallel
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ctest --test-dir build/asan-tests --output-on-failure
