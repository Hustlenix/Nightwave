name: Project quality

on:
  push:
    paths:
      - "docs/**"
      - "hardware/*.csv"
      - "tools/**"
      - "tests/**"
      - "firmware/components/audio_pipeline/**"
      - "firmware/components/audio_i2s/**"
      - "firmware/components/decoder/**"
      - "firmware/components/input/**"
      - "firmware/components/playback/**"
      - ".github/workflows/project-quality.yml"
      - "firmware/components/app_state/include/nightwave/hardware_config.h"
  pull_request:
    paths:
      - "docs/**"
      - "hardware/*.csv"
      - "tools/**"
      - "tests/**"
      - "firmware/components/audio_pipeline/**"
      - "firmware/components/audio_i2s/**"
      - "firmware/components/decoder/**"
      - "firmware/components/input/**"
      - "firmware/components/playback/**"
      - ".github/workflows/project-quality.yml"
      - "firmware/components/app_state/include/nightwave/hardware_config.h"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate BOMs and wiring consistency
        run: python3 tools/validate_project.py
      - name: Generate deterministic audio fixtures
        run: python3 tools/generate_test_media.py --output .generated/test-media
      - name: Configure portable firmware tests
        run: cmake -S tests -B build/host-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build portable firmware tests
        run: cmake --build build/host-tests --config Release --parallel
      - name: Run portable firmware tests
        run: ctest --test-dir build/host-tests --build-config Release --output-on-failure
